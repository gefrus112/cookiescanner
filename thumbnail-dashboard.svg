<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CookieScope privacy preview</title>
  <desc id="desc">Lightweight privacy and safety preview panel for CookieScope scanner.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#17120f"/>
      <stop offset="100%" stop-color="#2a201d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7c195"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <g opacity="0.16">
    <circle cx="1230" cy="210" r="260" fill="#ff8a3d"/>
    <circle cx="320" cy="740" r="260" fill="#ffb26b"/>
  </g>

  <g transform="translate(120 120)">
    <rect width="1360" height="660" rx="30" fill="#1d1513" stroke="#4b3d35"/>
    <rect x="70" y="70" width="430" height="520" rx="28" fill="#221b18"/>
    <text x="100" y="128" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#ffb279">SAFETY / 03</text>
    <text x="100" y="196" font-family="Verdana, Arial, sans-serif" font-size="52" font-weight="700" fill="#fffaf4">Keep secrets</text>
    <text x="100" y="252" font-family="Verdana, Arial, sans-serif" font-size="52" font-weight="700" fill="#ff9d61">out of the scan.</text>
    <text x="100" y="332" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#c7b7af">Never paste passwords, access tokens,</text>
    <text x="100" y="366" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#c7b7af">or live credentials into the scanner.</text>

    <g transform="translate(620 120)">
      <rect width="650" height="430" rx="26" fill="#1c1412" stroke="#473c36"/>
      <rect x="42" y="38" width="566" height="46" rx="12" fill="#2b221d"/>
      <rect x="42" y="116" width="566" height="58" rx="12" fill="#2b221d"/>
      <rect x="42" y="198" width="566" height="58" rx="12" fill="#2b221d"/>
      <rect x="42" y="280" width="566" height="58" rx="12" fill="#2b221d"/>
      <rect x="42" y="362" width="206" height="42" rx="12" fill="#ff8a3d"/>
      <rect x="470" y="362" width="138" height="42" rx="12" fill="#312c28"/>
      <circle cx="70" cy="145" r="10" fill="#ffb276"/>
      <circle cx="100" cy="145" r="10" fill="#ffc894"/>
      <circle cx="130" cy="145" r="10" fill="#fffaf4"/>
      <g opacity="0.9">
        <rect x="84" y="238" width="180" height="20" rx="10" fill="#ffb276"/>
        <rect x="290" y="238" width="120" height="20" rx="10" fill="#ffb276"/>
      </g>
    </g>
  </g>
</svg>
