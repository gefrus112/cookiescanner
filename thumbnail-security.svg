<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CookieScope security interface</title><desc id="desc">A dark orange animated-style security dashboard showing local processing and protected cookie review.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120e0c"/><stop offset="1" stop-color="#2d1d16"/></linearGradient><radialGradient id="glow"><stop stop-color="#ff8a3d" stop-opacity=".5"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1250" cy="260" r="370" fill="url(#glow)"/><g transform="translate(100 90)"><rect width="1400" height="720" rx="28" fill="#1b1411" stroke="#574238" stroke-width="2"/><rect x="40" y="38" width="1320" height="64" rx="14" fill="#241914"/><circle cx="76" cy="70" r="8" fill="#ff8a3d"/><text x="112" y="78" fill="#fffaf4" font-family="Arial" font-size="25" font-weight="700">CookieScope</text><text x="1090" y="76" fill="#73d6a0" font-family="monospace" font-size="15">● LOCAL-FIRST SECURITY</text><text x="78" y="185" fill="#ffb276" font-family="monospace" font-size="16">LIVE SECURITY TELEMETRY / 01</text><text x="78" y="255" fill="#fffaf4" font-family="Arial" font-size="58" font-weight="700">Your data stays</text><text x="78" y="322" fill="#ff9754" font-family="Arial" font-size="58" font-weight="700">in this tab.</text><text x="78" y="382" fill="#b9b1aa" font-family="Arial" font-size="21">No upload. No probing. No accidental exposure.</text><rect x="78" y="440" width="420" height="13" rx="6" fill="#3a2b23"/><rect x="78" y="440" width="284" height="13" rx="6" fill="#ff8a3d"/><text x="78" y="495" fill="#ffb276" font-family="monospace" font-size="15">PROTECTION STATUS</text><text x="78" y="535" fill="#73d6a0" font-family="Arial" font-size="28" font-weight="700">READY FOR AUTHORIZED REVIEW</text><g transform="translate(920 170)"><circle cx="220" cy="220" r="180" fill="none" stroke="#ff8a3d" stroke-opacity=".35" stroke-width="2" stroke-dasharray="8 14"/><circle cx="220" cy="220" r="125" fill="none" stroke="#fffaf4" stroke-opacity=".25"/><circle cx="220" cy="220" r="70" fill="#251811" stroke="#ff8a3d" stroke-width="2"/><text x="220" y="215" text-anchor="middle" fill="#ffb276" font-family="Arial" font-size="42">◎</text><text x="220" y="250" text-anchor="middle" fill="#b9b1aa" font-family="monospace" font-size="13">LOCAL SCAN</text><circle cx="220" cy="40" r="9" fill="#ffb276"/><circle cx="45" cy="220" r="9" fill="#73d6a0"/><circle cx="395" cy="220" r="9" fill="#ff6262"/></g></g></svg>
