<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">CookieScope privacy workflow</title><desc id="desc">A screenshot-style workflow showing capture, local masking, review, and safe cleanup.</desc><rect width="1600" height="900" fill="#17120f"/><text x="100" y="120" fill="#ffb276" font-family="monospace" font-size="20">AUTHORIZED REVIEW WORKFLOW</text><text x="100" y="205" fill="#fffaf4" font-family="Arial" font-size="58" font-weight="700">Capture. Mask. Review.</text><g transform="translate(100 290)"><g><rect width="300" height="270" rx="20" fill="#211a16" stroke="#443b35"/><text x="35" y="60" fill="#ff8a3d" font-family="monospace" font-size="17">01 / CAPTURE</text><text x="35" y="125" fill="#fffaf4" font-family="Arial" font-size="28" font-weight="700">Authorized</text><text x="35" y="165" fill="#b9b1aa" font-family="Arial" font-size="19">browser snapshot</text><circle cx="235" cy="210" r="28" fill="#ff8a3d"/><text x="235" y="219" text-anchor="middle" fill="#17120f" font-family="Arial" font-size="25">✓</text></g><path d="M330 135h80" stroke="#ff8a3d" stroke-width="3"/><g transform="translate(440)"><rect width="300" height="270" rx="20" fill="#211a16" stroke="#443b35"/><text x="35" y="60" fill="#ff8a3d" font-family="monospace" font-size="17">02 / MASK</text><text x="35" y="125" fill="#fffaf4" font-family="Arial" font-size="28" font-weight="700">Secrets</text><text x="35" y="165" fill="#b9b1aa" font-family="Arial" font-size="19">hidden by default</text><text x="35" y="220" fill="#73d6a0" font-family="monospace" font-size="24">••••••••••</text></g><path d="M770 135h80" stroke="#ff8a3d" stroke-width="3"/><g transform="translate(880)"><rect width="300" height="270" rx="20" fill="#211a16" stroke="#443b35"/><text x="35" y="60" fill="#ff8a3d" font-family="monospace" font-size="17">03 / REVIEW</text><text x="35" y="125" fill="#fffaf4" font-family="Arial" font-size="28" font-weight="700">Risk signals</text><text x="35" y="165" fill="#b9b1aa" font-family="Arial" font-size="19">triage without probing</text><text x="35" y="220" fill="#ffb276" font-family="monospace" font-size="24">SCORE 32 / 100</text></g></g><text x="100" y="690" fill="#73d6a0" font-family="monospace" font-size="18">✓ DELETE SNAPSHOTS AFTER THE APPROVED REVIEW</text></svg>
